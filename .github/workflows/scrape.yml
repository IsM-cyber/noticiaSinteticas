name: scrape

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# si un run tarda más de 30 min, no dejar que se pisen dos a la vez
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Correr el robot
        run: python -m scraper.main

      - name: Committear el resultado
        run: |
          git config user.name "noticias-sinteticas-bot"
          git config user.email "bot@localhost"
          git add data/news.json
          git diff --cached --quiet || git commit -m "chore: actualizar ranking $(date -u +%Y-%m-%dT%H:%M)"
          git push